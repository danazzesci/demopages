<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assurance Lab · Executive briefing</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#eef3f1;font-family:Helvetica,Arial,sans-serif}main{max-width:430px;margin:16vh auto;padding:30px}h1{font-family:Garamond,Georgia,serif;font-size:44px;font-weight:400}label{display:block;margin-bottom:12px}input,button{font:inherit;width:100%;padding:14px;border-radius:5px}input{background:#fff;border:1px solid #bcc8c4}button{margin-top:16px;background:#93ded0;border:0;cursor:pointer}#status{min-height:24px;color:#f4c59a}iframe{display:block;width:100%;height:100dvh;border:0;background:#101820}[hidden]{display:none!important}</style></head><body><main id="login"><span>ASSURANCE LAB</span><h1>Executive briefing</h1><form id="form"><label for="password">Enter your access password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">View the briefing</button><p id="status" role="status"></p></form></main><iframe id="content" title="Assurance Lab briefing" sandbox="allow-scripts allow-modals allow-downloads" hidden></iframe><script>
let credential='';const frame=document.getElementById('content'),login=document.getElementById('login'),status=document.getElementById('status'),button=document.getElementById('submit');
async function load(page){const response=await fetch('https://mmxihcwpywptlazzpglg.supabase.co/functions/v1/assurance-executive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:credential,page}),cache:'no-store'});if(!response.ok)throw new Error(response.status===401?'The password was not accepted.':response.status===429?'Please wait a minute before trying again.':'The briefing could not load. Please try again.');const data=await response.json();frame.srcdoc=data.html;frame.hidden=false;login.hidden=true;document.getElementById('password').value='';}
document.getElementById('form').addEventListener('submit',async(e)=>{e.preventDefault();credential=document.getElementById('password').value;button.disabled=true;status.textContent='Opening your briefing…';try{await load('buyer');}catch(e){credential='';status.textContent=e.message;}finally{button.disabled=false;}});
window.addEventListener('message',async(e)=>{if(e.source!==frame.contentWindow||!['buyer','proposal'].includes(e.data?.page))return;try{await load(e.data.page);}catch(e){login.hidden=false;frame.hidden=true;status.textContent=e.message;}});
</script></body></html>

name: Publish homepage and refresh headlines
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare static site and current headlines
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          python3 - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, 'lance')
          import server
          server.refresh()
          if server.CACHE['items']:
              Path('_site/lance/news.json').write_text(json.dumps(server.CACHE, ensure_ascii=False))
          else:
              print('Feeds unavailable; preserving the bundled headline snapshot.')
          PY
      - name: Publish refreshed news independently of Pages
        run: |
          cp _site/lance/news.json /tmp/latest-news.json
          git fetch origin news-data || true
          if git show-ref --verify --quiet refs/remotes/origin/news-data; then
            git checkout -B news-data origin/news-data
          else
            git checkout -b news-data
          fi
          cp /tmp/latest-news.json lance/news.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lance/news.json
          git diff --cached --quiet || git commit -m "Refresh international headlines"
          git push origin news-data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
